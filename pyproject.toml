[project]
name = "podcast-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Stephen Finney", email = "stephen.finney@spinen.com" }
]
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.14",
    "google-api-python-client>=2.199.0",
    "google-auth-httplib2>=0.4.2",
    "google-auth-oauthlib>=1.4.1",
    "google-genai>=2.20.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "static-ffmpeg>=3.0",
    "tqdm>=4.70.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
podcast-pipeline = "podcast_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
